name: Site vitrine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Déclenché par l'application quand le contenu du site est modifié (voir CONTENU_SITE.md)
  repository_dispatch:
    types: [contenu-modifie]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Récupérer le contenu de l'application
        # Si CONTENT_URL est défini et que la récupération échoue, la construction s'arrête
        # et le site déjà en ligne reste inchangé.
        if: vars.CONTENT_URL != ''
        env:
          CONTENT_URL: ${{ vars.CONTENT_URL }}
        run: python tools/fetch_content.py
      - name: Construire le site
        # Réglages à définir dans Settings > Secrets and variables > Actions > Variables
        env:
          API_BASE: ${{ vars.API_BASE }}
          APP_URL: ${{ vars.APP_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Publication uniquement depuis la branche principale (jamais depuis une proposition de modification)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
