{% extends "base.html" %}
{% block title %}{{ t.news_title }}{% endblock %}
{% block content %}
<article id="actualite" class="card" aria-live="polite"><p class="muted js-loading">{{ t.loading }}</p></article>
<p id="fallback" class="alert" hidden>{{ t.unavailable }}</p>
<noscript><p class="alert">{{ t.no_js }}</p></noscript>
<p><a href="actualites.html">{{ t.back }}</a></p>
{% endblock %}
