{% extends "base.html" %}
{% block title %}{{ t.news_title }}{% endblock %}
{% block content %}
<h1>{{ t.news_title }}</h1>
<div id="actualites-list" aria-live="polite"><p class="muted js-loading">{{ t.loading }}</p></div>
<p id="fallback" class="alert" hidden>{{ t.unavailable }}</p>
<noscript><p class="alert">{{ t.no_js }}</p></noscript>
{% endblock %}
